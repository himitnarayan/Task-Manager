{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel slide-up">
        <h1 class="text-gradient">Welcome Back</h1>
        <p class="subtitle">Sign in to continue to Nexus</p>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="glass-input" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="glass-input" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
